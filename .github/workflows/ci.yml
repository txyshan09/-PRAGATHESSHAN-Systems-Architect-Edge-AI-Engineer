name: Cross-Language System Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  execute-tests:
    runs-on: ubuntu-latest

    # Overriding global environmental time matrices for all steps inside the cloud container
    env:
      GIT_AUTHOR_DATE: "2026-05-15T14:30:00"
      GIT_COMMITTER_DATE: "2025-03-15T14:30:00"
      TZ: "Asia/Kuala_Lumpur" # Locks the runtime timezone constraint

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Pulls full git commit logs instead of an isolated shallow state

    - name: Setup Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Math Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy

    - name: Execute Python Engine Tests
      run: |
        python q-logist/q_logist_optimizer.py
        python ev3-digital-twin/twin_telemetry.py
        python vision-ai/vital_sense_engine.py
        python vision-ai/motion_tracker.py

    - name: Setup PHP Environment
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: pdo, pdo_mysql

    - name: Validate Relational Database Schema Syntax
      run: |
        sudo apt-get update && sudo apt-get install -y mysql-client
        mysql -u root -proot -e "source database/schema.sql"

    - name: Execute PHP Structural System Verification
      run: php tests/verify.php
