name: Cross-Language System Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  execute-tests:
    runs-on: ubuntu-latest

    env:
      GIT_AUTHOR_DATE: "2026-05-15T14:30:00"
      GIT_COMMITTER_DATE: "2026-05-15T14:30:00"
      TZ: "Asia/Kuala_Lumpur"

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Setup Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Math Dependencies
      run: pip install numpy

    - name: Run Q-Logist Test
      run: python q-logist/q_logist_optimizer.py

    - name: Run Telemetry Test
      run: python ev3-digital-twin/twin_telemetry.py

    - name: Run Vision Engine Test
      run: python vision-ai/vital_sense_engine.py

    - name: Run Motion Tracker Test
      run: python vision-ai/motion_tracker.py

    - name: Setup PHP Environment
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'

    - name: Execute PHP Verification Script
      run: php tests/verify.php
