name: Cross-Language System Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  execute-tests:
    runs-on: ubuntu-latest

    env:
      GIT_AUTHOR_DATE: "2026-05-15T14:30:00"
      GIT_COMMITTER_DATE: "2026-05-15T14:30:00"
      TZ: "Asia/Kuala_Lumpur"

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Math Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy

    - name: Execute Python Engine Tests
      run: |
        echo "🏃 Validating Q-Logist..."
        cd q-logist && python q_logist_optimizer.py && cd ..
        
        echo "🏃 Validating Digital Twin..."
        cd ev3-digital-twin && python twin_telemetry.py && cd ..
        
        echo "🏃 Validating Vision Core..."
        cd vision-ai && python vital_sense_engine.py && cd ..
        
        echo "🏃 Validating Motion Tracker..."
        cd vision-ai && python motion_tracker.py && cd ..

    - name: Setup PHP Environment
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: pdo, pdo_mysql

    - name: Execute PHP Structural System Verification
      run: php tests/verify.php
