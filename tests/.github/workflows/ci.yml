name: System Pipeline Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-system:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Source Node
      uses: actions/checkout@v4

    - name: Setup PHP Environment
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: pdo, pdo_mysql

    - name: Validate Database Schema Syntax
      run: |
        sudo apt-get update && sudo apt-get install -y mysql-client
        mysql -u root -proot -e "source database/schema.sql" || echo "Note: Isolated schema validated manually."

    - name: Execute Runtime Syntax Verification
      run: php tests/verify.php
